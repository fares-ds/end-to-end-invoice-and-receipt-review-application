# Runs Invoice Review in one container. OCR (poppler and tesseract) is bundled in
# the image; the model is served by the Ollama running on your host.
#
#   docker compose up --build
#   open http://localhost:8000
#
# The container deliberately does not run its own Ollama. The default model is
# cloud-served and its credentials belong to the signed-in Ollama on the host, so
# a containerised Ollama could not authenticate. Pointing at the host also avoids
# the Apple silicon penalty, where a container cannot reach the Metal GPU.
#
# Requires Ollama running on the host and reachable at 11434.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:cloud}
      OCR_LANGUAGES: eng+nld+deu+fra
      ALLOWED_ORIGIN: http://localhost:8000
    extra_hosts:
      # Linux does not resolve host.docker.internal by default.
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      # Uploaded documents and the SQLite database stay on the host so a rebuild
      # does not discard the review history.
      - app-data:/app/data
    healthcheck:
      # /ready fails while OCR or the model server is unusable; /health would not.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready', timeout=10).status==200 else 1)\""]
      interval: 15s
      timeout: 12s
      retries: 10
      start_period: 20s

volumes:
  app-data:
